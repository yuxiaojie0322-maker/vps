name: VPSFree 自动续期

on:
  schedule:
    - cron: "0 2 */7 * *"   # 每7天凌晨2点执行
  workflow_dispatch:        # 支持手动触发执行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统工具
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget xvfb curl

      - name: 下载并解压 Buster 语音打码插件
        run: |
          mkdir -p scripts/extensions/buster/unpacked
          
          # 使用跟进重定向 (-L) 确保下载真正的 zip 文件而非 404 网页
          wget -q -L -O /tmp/buster.zip \
            "https://github.com/eoiner/buster/releases/download/v2.0.1/buster-2.0.1-chrome.zip" || true

          if [ -f /tmp/buster.zip ] && [ $(stat -c%s "/tmp/buster.zip") -gt 100000 ]; then
            7z x -y /tmp/buster.zip -oscripts/extensions/buster/unpacked
            echo "✅ Buster 插件解压成功"
          else
            echo "⚠️ 官方 Release 获取失败，尝试使用预备备份源..."
            # 备用直连下载路径
            wget -q -L -O /tmp/buster.zip \
              "https://raw.githubusercontent.com/eoiner/buster/master/manifest.json" || true
            echo "已跳过压缩包解压，由脚本处理回退逻辑"
          fi

      - name: 安装 Python 依赖与 Playwright 环境
        run: |
          pip install playwright requests
          sudo $(which playwright) install-deps chromium
          playwright install chromium

      - name: 执行续期 (Virtual Screen 模式)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run python renew_vps.py
