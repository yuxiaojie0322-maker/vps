name: VPSFree 自动续期

on:
  schedule:
    - cron: "0 2 */7 * *"   # 每7天凌晨2点运行
  workflow_dispatch:          # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: 安装 Python 依赖
        run: |
          pip install playwright requests
          playwright install chromium

      - name: 执行续期
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          CAPTCHA_KEY: ${{ secrets.CAPTCHA_KEY }}
        run: |
          python renew_vps.py

      - name: 上传截图（失败时调试用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/renew_*.png
          retention-days: 7

      - name: 发送通知（续期失败时）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ VPSFree 续期失败',
              body: '自动续期脚本运行失败，请手动登录 https://manager.vpsfree.es 续期！'
            })
