name: VPSFree 自动续期

on:
  schedule:
    - cron: "0 2 */7 * *"   # 每7天凌晨2点执行
  workflow_dispatch:        # 支持手动触发执行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖与下载 Buster 语音打码插件
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget xvfb curl
          mkdir -p scripts/extensions/buster
          
          # 自动获取 Buster 最新版 zip 链接，避免硬编码 404
          BUSTER_URL=$(curl -s https://api.github.com/repos/eoiner/buster/releases/latest | grep "browser_download_url.*zip" | cut -d : -f 2,3 | tr -d \")
          if [ -z "$BUSTER_URL" ]; then
            BUSTER_URL="https://github.com/eoiner/buster/releases/download/v2.0.1/buster-2.0.1-chrome.zip"
          fi
          
          echo "下载地址: $BUSTER_URL"
          wget -q -O /tmp/buster.zip "$BUSTER_URL" || true
          
          if [ -f /tmp/buster.zip ]; then
            7z x -y /tmp/buster.zip -oscripts/extensions/buster/unpacked
            echo "Buster 插件下载并解压完成"
          else
            echo "Buster 下载失败，跳过插件加载"
          fi

      - name: 安装 Python 依赖与 Playwright 环境
        run: |
          pip install playwright requests
          sudo $(which playwright) install-deps chromium
          playwright install chromium

      - name: 执行续期 (Virtual Screen 模式)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run python renew_vps.py
