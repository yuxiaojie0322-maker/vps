name: VPSFree 自动续期

on:
  schedule:
    - cron: "0 2 */7 * *"   # 每7天凌晨2点执行
  workflow_dispatch:        # 支持手动触发执行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖与下载 NopeCHA 插件
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget xvfb curl
          mkdir -p scripts/extensions/nopecha
          
          # 下载并解压 NopeCHA 插件
          wget -q -L -O /tmp/nopecha.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip || true
          
          if [ -f /tmp/nopecha.zip ]; then
            7z x -y /tmp/nopecha.zip -oscripts/extensions/nopecha/unpacked
            echo "✅ NopeCHA 插件下载完成"
          fi

      - name: 安装 Python 依赖与 Playwright 环境
        run: |
          pip install playwright requests
          sudo $(which playwright) install-deps chromium
          playwright install chromium

      - name: 执行续期 (Virtual Screen 模式)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run python renew_vps.py
