name: VPSFree 自动续期

on:
  workflow_dispatch: # 支持手动点击运行测试
  schedule:
    # 每 5 天自动执行一次
    - cron: '0 2 */5 * *'

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖与 Playwright
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: 自动准备 NopeCHA 验证码插件
        run: |
          echo "创建插件目录并从官方源下载 NopeCHA..."
          mkdir -p scripts/extensions/nopecha/unpacked
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d scripts/extensions/nopecha/unpacked
          echo "插件解压完成，检查文件清单："
          ls -la scripts/extensions/nopecha/unpacked

      - name: 启动后台 Hysteria2 代理 (sing-box)
        run: |
          echo "下载 sing-box 客户端..."
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

          echo "生成节点配置文件..."
          cat << 'EOF' > config.json
          {
            "inbounds": [
              {
                "type": "mixed",
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 7890
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "tag": "hy2-out",
                "server": "fi2.elysiannodes.uk",
                "server_port": 2009,
                "password": "35da4b28-3250-451d-a626-097ebd695933",
                "tls": {
                  "enabled": true,
                  "server_name": "www.bing.com",
                  "insecure": true,
                  "alpn": ["h3"]
                }
              }
            ]
          }
          EOF

          echo "启动后台代理..."
          ./sing-box run -c config.json &
          sleep 4
          curl -x http://127.0.0.1:7890 https://api.ipify.org || echo "代理就绪"

      - name: 运行续期脚本 (Xvfb 虚拟屏幕环境)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: "http://127.0.0.1:7890"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python renew_vps.py

      - name: 上传排查截图 (如果失败或需要查看)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-screenshots
          path: "*.png"
          retention-days: 3
