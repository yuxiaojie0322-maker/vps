name: VPSFree 自动续期

on:
  workflow_dispatch: # 支持手动点击运行测试
  schedule:
    # 每天 UTC 00:00 和 12:00 (北京时间 08:00 和 20:00) 各执行一次，精准捕捉 24 小时续期窗口
    - cron: '0 0,12 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖与 Playwright
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: 自动准备 NopeCHA 验证码插件
        run: |
          mkdir -p scripts/extensions/nopecha/unpacked
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d scripts/extensions/nopecha/unpacked

      - name: 启动后台 Hysteria2 代理 (sing-box)
        run: |
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

          cat << 'EOF' > config.json
          {
            "inbounds": [
              {
                "type": "mixed",
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 7890
              }
            ],
            "outbounds": [
              {
                "type": "hysteria2",
                "tag": "hy2-out",
                "server": "fi2.elysiannodes.uk",
                "server_port": 2009,
                "password": "35da4b28-3250-451d-a626-097ebd695933",
                "tls": {
                  "enabled": true,
                  "server_name": "www.bing.com",
                  "insecure": true,
                  "alpn": ["h3"]
                }
              }
            ]
          }
          EOF

          ./sing-box run -c config.json &
          sleep 4
          curl -x http://127.0.0.1:7890 https://api.ipify.org || echo "代理就绪"

      - name: 运行续期脚本 (Xvfb 虚拟屏幕环境)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: "http://127.0.0.1:7890"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" python renew_vps.py
