name: VPSFree 自动续期

on:
  schedule:
    - cron: "0 2 */7 * *"   # 每7天凌晨2点执行
  workflow_dispatch:        # 支持手动触发执行

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统工具
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget xvfb curl

      - name: 下载 Buster 语音打码插件 (使用官方 Release Action)
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "eoiner/buster"
          latest: true
          fileName: "*chrome.zip"
          outFilePath: "/tmp"

      - name: 解压 Buster 插件
        run: |
          mkdir -p scripts/extensions/buster/unpacked
          if [ -f /tmp/*chrome.zip ]; then
            7z x -y /tmp/*chrome.zip -oscripts/extensions/buster/unpacked
            echo "✅ Buster 插件解压成功"
          else
            echo "⚠️ 未找到 Buster zip 文件"
          fi

      - name: 安装 Python 依赖与 Playwright 环境
        run: |
          pip install playwright requests
          sudo $(which playwright) install-deps chromium
          playwright install chromium

      - name: 执行续期 (Virtual Screen 模式)
        env:
          VPS_EMAIL: ${{ secrets.VPS_EMAIL }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run python renew_vps.py
